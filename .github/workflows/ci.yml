name: CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build with CMake (${{ matrix.os }} - ${{ matrix.build_type }} - ${{ matrix.library_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
        library_type: [Static, Shared]
        include:
          - library_type: Static
            shared_libs: OFF
          - library_type: Shared
            shared_libs: ON

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTINYTEST_BUILD_SHARED_LIBS=${{ matrix.shared_libs }}
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test with CTest
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

  installation-test:
    name: Installation Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and Install
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$HOME/tinytest-install
          cmake --build build --target install

      - name: Verify Installation
        run: |
          test -f "$HOME/tinytest-install/include/tinytest/tinytest.h"
          test -f "$HOME/tinytest-install/lib/cmake/TinyTest/TinyTestConfig.cmake"
          test -f "$HOME/tinytest-install/lib/pkgconfig/tinytest.pc"
          echo "Installation verified successfully."
